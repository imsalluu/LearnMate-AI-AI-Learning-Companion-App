version: '3.8'

services:
  # PostgreSQL with pgvector extension for RAG vector search
  postgres:
    image: pgvector/pgvector:pg16
    container_name: learnmate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: learnmate_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for background BullMQ queues and rate-limiting
  redis:
    image: redis:7-alpine
    container_name: learnmate-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js TypeScript REST & Agent API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learnmate-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/learnmate_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: super_secure_production_secret_key_learnmate_2026
      JWT_REFRESH_SECRET: super_secure_production_refresh_secret_key_learnmate_2026
      AI_PROVIDER: mock
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: ./uploads
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads

volumes:
  pgdata:
  redisdata:
  uploads_data:
