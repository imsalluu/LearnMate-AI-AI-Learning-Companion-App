name: learnmate_ai
description: "LearnMate AI - Production-grade AI-powered learning companion mobile app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Networking & Storage
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # UI, Fonts & Formatting
  google_fonts: ^6.2.1
  flutter_markdown: ^0.7.2+1
  intl: ^0.19.0
  uuid: ^4.4.0
  percent_indicator: ^4.2.3
  flutter_spinkit: ^5.2.1

  # Audio & Media
  audioplayers: ^6.0.0
  file_picker: ^8.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
